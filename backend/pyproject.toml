[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acaddoc"
version = "0.3.0"
description = "Structured course content in, institutional Word/PDF documents out"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "python-docx>=1.1",
    "docxtpl>=0.17",
    "docxcompose>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pdfplumber>=0.11"]

[project.scripts]
acaddoc = "acaddoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
